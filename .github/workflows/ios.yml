# The iPhone app on a macOS runner — the half of iOS that cannot happen on Linux. The lanes of
# Unitool's ios.yml, without TestFlight (Touch VN has no App Store record yet):
#
#   device      Release for a real iPhone, UNSIGNED: TouchVN.app for scripts/ios-sign-and-install.sh
#               on a Mac with the certificate, and the same app as TouchVN-<run>.ipa for AltStore,
#               Sideloadly and the like. On a push to `ios-device`, or by hand.
#   simulator   Debug for the Apple-silicon simulator, unsigned. Only on a push to `ios-simulator`.
#
# Nothing else builds here: a push to main costs no macOS minutes.
name: ios

on:
  push:
    branches: [ios-device, ios-simulator]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch stops the older build there.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Compose Multiplatform 1.11.1 references UIViewLayoutRegion, an iOS 26 class, behind an
  # availability check; an older SDK's linker has to be told to leave it undefined.
  OTHER_LDFLAGS: '$(inherited) -Wl,-U,_OBJC_CLASS_$_UIViewLayoutRegion'

# macos-26, not macos-15, as in Unitool: macos-15's default Xcode 16.4 is older than what Kotlin
# 2.4 and Compose 1.11 are built for, and the App Store takes only builds from the iOS 26 SDK.
jobs:
  simulator:
    if: github.ref == 'refs/heads/ios-simulator'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-prepare
        with:
          superizer_repo: ${{ vars.SUPERIZER_REPO || 'adminization/superizer' }}
          # Superizer 0.8.2 — the version gradle/libs.versions.toml names. Bumped together with it.
          superizer_ref: ${{ vars.SUPERIZER_REF || 'a99b4baa9f98282c5bd443f096f65fc146f3391b' }}
          framework_task: linkDebugFrameworkIosSimulatorArm64

      - name: Build for the simulator
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-dd \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_LDFLAGS="$OTHER_LDFLAGS" \
            build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-app
          path: build/ios-dd/Build/Products/Debug-iphonesimulator/*.app

  device:
    if: github.ref == 'refs/heads/ios-device' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-prepare
        with:
          superizer_repo: ${{ vars.SUPERIZER_REPO || 'adminization/superizer' }}
          superizer_ref: ${{ vars.SUPERIZER_REF || 'a99b4baa9f98282c5bd443f096f65fc146f3391b' }}
          framework_task: linkReleaseFrameworkIosArm64

      # Unsigned on purpose: the certificate lives on the owner's Mac and never in this repository.
      # The build number is the run number, so two installs never carry the same CFBundleVersion.
      - name: Build for a device, unsigned
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            OTHER_LDFLAGS="$OTHER_LDFLAGS" \
            build 2>&1 | tee build/xcodebuild.log

      - uses: actions/upload-artifact@v4
        with:
          name: ios-device-unsigned-app
          path: build/ios-dd/Build/Products/Release-iphoneos/*.app
          if-no-files-found: error

      # An .ipa is a zip with the app under Payload/. -y keeps the symlinks of the bundle as symlinks.
      - name: Pack the .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios-dd/Build/Products/Release-iphoneos/TouchVN.app build/ipa/Payload/
          cd build/ipa
          zip -qry "TouchVN-${{ github.run_number }}.ipa" Payload

      # archive: false uploads the file itself, not a zip around it.
      - uses: actions/upload-artifact@v7
        with:
          path: build/ipa/TouchVN-${{ github.run_number }}.ipa
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 14
          if-no-files-found: ignore
