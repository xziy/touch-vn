# The iPhone app on a macOS runner — the half of iOS that cannot happen on Linux. The lanes of
# Unitool's ios.yml (../unitool, the same as RestoApp touch's):
#
#   testflight  Release, archived, signed and uploaded to App Store Connect (team Ivan Sizyi,
#               vn.touch.portal, app "Touch VN"). On a push to main, by hand on main, or by the label
#               `testflight` on a pull request into main — what the branch holds at that moment, once.
#               Runs only when the signing secrets are present; otherwise it says so and stops, green.
#               Then `distribute` waits for Apple to process the build and puts it in the TestFlight
#               group (README, iPhone).
#   device      Release for a real iPhone, UNSIGNED: TouchVN.app for scripts/ios-sign-and-install.sh
#               on a Mac with the certificate, and the same app as TouchVN-<run>.ipa for AltStore,
#               Sideloadly and the like. On a push to `ios-device`, or by hand off main.
#   simulator   Debug for the Apple-silicon simulator, unsigned. Only on a push to `ios-simulator`.
#
# The repository is public, so macOS minutes cost nothing; still, a commit of notes or of the web
# tests alone builds nothing.
name: ios

on:
  pull_request:
    branches: [main]
    types: [labeled]
  push:
    branches: [main, ios-device, ios-simulator]
    paths-ignore: ['**.md', 'e2e/**']
  workflow_dispatch:

permissions:
  contents: read

# An upload is never cancelled: a push to main waits for the build before it. A newer push to
# ios-device or ios-simulator stops the older build there.
concurrency:
  group: ios-${{ github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

env:
  # Compose Multiplatform 1.11.1 references UIViewLayoutRegion, an iOS 26 class, behind an
  # availability check; an older SDK's linker has to be told to leave it undefined.
  OTHER_LDFLAGS: '$(inherited) -Wl,-U,_OBJC_CLASS_$_UIViewLayoutRegion'

# macos-26, not macos-15, as in Unitool: macos-15's default Xcode 16.4 is older than what Kotlin
# 2.4 and Compose 1.11 are built for, and the App Store takes only builds from the iOS 26 SDK.
jobs:
  simulator:
    if: github.ref == 'refs/heads/ios-simulator'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-prepare
        with:
          superizer_repo: ${{ vars.SUPERIZER_REPO || 'adminization/superizer' }}
          # Superizer 0.8.2 — the version gradle/libs.versions.toml names. Bumped together with it.
          superizer_ref: ${{ vars.SUPERIZER_REF || 'a99b4baa9f98282c5bd443f096f65fc146f3391b' }}
          framework_task: linkDebugFrameworkIosSimulatorArm64

      - name: Build for the simulator
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-dd \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_LDFLAGS="$OTHER_LDFLAGS" \
            build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-app
          path: build/ios-dd/Build/Products/Debug-iphonesimulator/*.app

  device:
    if: >-
      github.ref == 'refs/heads/ios-device'
      || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-prepare
        with:
          superizer_repo: ${{ vars.SUPERIZER_REPO || 'adminization/superizer' }}
          superizer_ref: ${{ vars.SUPERIZER_REF || 'a99b4baa9f98282c5bd443f096f65fc146f3391b' }}
          framework_task: linkReleaseFrameworkIosArm64

      # Unsigned on purpose: the certificate lives on the owner's Mac and never in this repository.
      # The build number is the run number, so two installs never carry the same CFBundleVersion.
      - name: Build for a device, unsigned
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            OTHER_LDFLAGS="$OTHER_LDFLAGS" \
            build 2>&1 | tee build/xcodebuild.log

      - uses: actions/upload-artifact@v4
        with:
          name: ios-device-unsigned-app
          path: build/ios-dd/Build/Products/Release-iphoneos/*.app
          if-no-files-found: error

      # An .ipa is a zip with the app under Payload/. -y keeps the symlinks of the bundle as symlinks.
      - name: Pack the .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios-dd/Build/Products/Release-iphoneos/TouchVN.app build/ipa/Payload/
          cd build/ipa
          zip -qry "TouchVN-${{ github.run_number }}.ipa" Payload

      # archive: false uploads the file itself, not a zip around it.
      - uses: actions/upload-artifact@v7
        with:
          path: build/ipa/TouchVN-${{ github.run_number }}.ipa
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 14
          if-no-files-found: ignore

  testflight:
    if: >-
      github.event.label.name == 'testflight'
      || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 75
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v4

      # Secrets cannot be read in a job-level `if`, so the check is a step with an output. Missing
      # secrets end the job green with a notice: this lane is opt-in, not a gate.
      - name: Are the signing secrets here?
        id: gate
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          [ -n "$P12" ]          || missing="$missing IOS_DIST_CERT_P12_BASE64"
          [ -n "$P12_PASSWORD" ] || missing="$missing IOS_DIST_CERT_PASSWORD"
          [ -n "$PROFILE" ]      || missing="$missing IOS_PROFILE_BASE64"
          [ -n "$KEY_ID" ]       || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER_ID" ]    || missing="$missing ASC_ISSUER_ID"
          [ -n "$P8" ]           || missing="$missing ASC_KEY_P8_BASE64"
          if [ -n "$missing" ]; then
            echo "::notice::TestFlight lane skipped — secrets not set:$missing (README, iPhone)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/ios-prepare
        if: steps.gate.outputs.ready == 'true'
        with:
          superizer_repo: ${{ vars.SUPERIZER_REPO || 'adminization/superizer' }}
          superizer_ref: ${{ vars.SUPERIZER_REF || 'a99b4baa9f98282c5bd443f096f65fc146f3391b' }}
          framework_task: linkReleaseFrameworkIosArm64

      # Signed by hand, as Unitool is. Automatic signing on a clean runner would have to mint a
      # development certificate every run, and the API key is an App Manager's. So the App Store
      # profile is a secret like the certificate; ios-ci-signing.py checks the two against each other
      # and the app, and points the build at them.
      - name: Install the certificate, the profile and the App Store Connect key
        if: steps.gate.outputs.ready == 'true'
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/dist.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 '"' || true)
          if [ -z "$IDENTITY" ]; then
            security find-identity -p codesigning "$KEYCHAIN"
            echo "::error::IOS_DIST_CERT_P12_BASE64 gave no valid signing identity (what it gave is above)"
            exit 1
          fi
          SHA1=$(echo "$IDENTITY" | awk '{print $2}')
          NAME=$(echo "$IDENTITY" | sed 's/^[^"]*"\(.*\)"$/\1/')
          echo "Signing as: $NAME"

          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(python3 scripts/ios-ci-signing.py "$RUNNER_TEMP/profile.plist" "$SHA1" "$NAME")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mv "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          mkdir -p "$HOME/private_keys"
          printf '%s' "$P8" | base64 --decode > "$HOME/private_keys/AuthKey_$KEY_ID.p8"

      # Info.plist says NO: the app has no cryptography of its own. An upload that says YES must carry
      # the key of approved documentation, or Apple refuses it (ITMS-90592). So should Apple ever issue
      # one, it is read here on every build and written in together with the YES.
      - name: Export compliance key
        if: steps.gate.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          CODE=$(python3 scripts/testflight-distribute.py --compliance-code)
          if [ -n "$CODE" ]; then
            plutil -replace ITSAppUsesNonExemptEncryption -bool YES iosApp/iosApp/Info.plist
            plutil -replace ITSEncryptionExportComplianceCode -string "$CODE" iosApp/iosApp/Info.plist
            echo "Info.plist declares the encryption, with its key"
          else
            echo "No encryption documentation key; Info.plist answers NO"
          fi

      # The build number is the run number, so every upload is a new build.
      - name: Archive
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/TouchVN.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            OTHER_LDFLAGS="$OTHER_LDFLAGS" \
            archive 2>&1 | tee build/xcodebuild.log

      # `destination: upload` in the export options sends the build straight to App Store Connect;
      # it appears under TestFlight once Apple has processed it.
      - name: Upload to TestFlight
        id: upload
        if: steps.gate.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/TouchVN.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee build/export.log
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Forget the key
        if: always()
        run: |
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/signing.keychain-db" "$RUNNER_TEMP/profile.plist" \
            iosApp/Configuration/Signing.xcconfig || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            build/xcodebuild.log
            build/export.log
          retention-days: 14
          if-no-files-found: ignore

  # An upload reaches nobody by itself: Apple processes it for minutes, and then it has to be put in
  # a TestFlight group. That wait happens here, on Linux. The group is the repository variable
  # TESTFLIGHT_GROUP, `dev` when unset.
  distribute:
    needs: testflight
    if: needs.testflight.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Apple, then give the build to the testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: python3 scripts/testflight-distribute.py ${{ github.run_number }} "${{ vars.TESTFLIGHT_GROUP || 'dev' }}"
