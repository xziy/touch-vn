<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A66"/>
      <stop offset="1" stop-color="#E8473F"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD25E"/>
      <stop offset="1" stop-color="#FFB02E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- touch ripples under the pin -->
  <ellipse cx="512" cy="792" rx="250" ry="62" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="22"/>
  <ellipse cx="512" cy="792" rx="150" ry="36" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="22"/>
  <ellipse cx="512" cy="792" rx="54" ry="14" fill="#FFFFFF" fill-opacity="0.9"/>
  <!-- location pin -->
  <path d="M512 196
           C 392 196 296 292 296 412
           C 296 560 512 772 512 772
           C 512 772 728 560 728 412
           C 728 292 632 196 512 196 Z" fill="#FFFFFF"/>
  <!-- sun inside the pin -->
  <circle cx="512" cy="410" r="112" fill="url(#sun)"/>
  <!-- sea waves across the sun -->
  <path d="M398 444 q 28 -22 57 0 t 57 0 t 57 0 t 57 0" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  <path d="M418 488 q 23 -18 47 0 t 47 0 t 47 0 t 47 0" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
</svg>
